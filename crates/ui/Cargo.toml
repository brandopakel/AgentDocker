[package]
name = "agentdocker-ui"
description = "The AgentDocker desktop app: a native window over the agentd socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# eframe/egui 0.36 need a newer compiler than the rest of the workspace.
# Kept here so `cargo install --path crates/cli` still builds on 1.87.
rust-version = "1.95"

[[bin]]
name = "agentdocker-ui"
path = "src/main.rs"

[dependencies]
agentdocker-core.workspace = true
agentdocker-host.workspace = true
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
vt100.workspace = true

# Posting a notification that carries our icon is only possible from
# inside our own bundle: macOS attributes a notification to the bundle
# of the process that posts it, and every way of overriding that has
# been closed. So the app posts, and the daemon asks it to.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString"] }
objc2-user-notifications = { version = "0.3", features = [
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSettings",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
  "block2",
] }

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
