[package]
name = "agentdocker-host"
description = "Host-side I/O shared by the AgentDocker daemon and CLI: project discovery and process inspection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
agentdocker-core.workspace = true
chrono.workspace = true
libc.workspace = true
nix.workspace = true
sha2.workspace = true
shlex.workspace = true
ignore.workspace = true
same-file.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true
filetime.workspace = true

# sha2 0.10 otherwise uses its software backend on ARM. The asm feature
# dispatches to SHA instructions only when the CPU supports them, with the
# existing software fallback retained. Other targets keep their current backend.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
sysinfo.workspace = true
process-wrap.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "fingerprint"
harness = false
