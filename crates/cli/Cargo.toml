[package]
name = "agentdocker"
description = "Docker-style control plane for AI agents: the `agentdocker` CLI and the `agentd` daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentdocker"
path = "src/main.rs"

[[bin]]
name = "agentd"
path = "src/bin/agentd.rs"

[dependencies]
agentd.workspace = true
agentdocker-core.workspace = true
agentdocker-host.workspace = true
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
chrono.workspace = true
clap.workspace = true
indexmap.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
ureq.workspace = true
toml.workspace = true
uuid.workspace = true

tempfile.workspace = true

[dev-dependencies]
filetime.workspace = true
tokio = { workspace = true, features = ["test-util"] }
