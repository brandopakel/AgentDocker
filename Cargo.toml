[workspace]
resolver = "3"
exclude = ["fuzz"]
members = ["crates/core", "crates/host", "crates/agentd", "crates/cli", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brandopakel/AgentDocker"
rust-version = "1.87"

[workspace.dependencies]
agentd = { path = "crates/agentd", version = "0.1.0" }
agentdocker-core = { path = "crates/core", version = "0.1.0" }
agentdocker-host = { path = "crates/host", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
criterion = "0.5.1"
vt100 = "0.16"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "crisp", "tokio", "x11", "wayland", "advanced"] }
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
accesskit = "0.24.1"
raw-window-handle = "0.6"
proptest = "1.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "socket", "uio"] }
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.44", features = ["full"] }
toml = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes"] }
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags"] }
filetime = "0.2"

# Repeated isolated worktrees otherwise retain many GiB of incremental state.
# Line tables retain useful backtraces without full dependency debug data.
[profile.dev]
incremental = false
debug = 1

# Ship optimized native executables without compiler symbols or unused code.
[profile.release]
strip = "symbols"
lto = "thin"
