[package]
name = "agentdocker-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
agentdocker-core = { path = "../crates/core" }
agentdocker-host = { path = "../crates/host" }
agentd = { path = "../crates/agentd" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false
[[bin]]
name = "resource-keys"
path = "fuzz_targets/resource_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine-metadata"
path = "fuzz_targets/engine_metadata.rs"
test = false
doc = false
bench = false
[[bin]]
name = "token-filter"
path = "fuzz_targets/token_filter.rs"
test = false
doc = false
bench = false
