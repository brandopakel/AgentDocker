[package]
name = "agentdocker-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
agentdocker-core = { path = "../crates/core" }
agentdocker-host = { path = "../crates/host" }
agentd = { path = "../crates/agentd" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false
[[bin]]
name = "resource-keys"
path = "fuzz_targets/resource_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine-metadata"
path = "fuzz_targets/engine_metadata.rs"
test = false
doc = false
bench = false
[[bin]]
name = "token-filter"
path = "fuzz_targets/token_filter.rs"
test = false
doc = false
bench = false

# A workspace of its own, though it has no other member. Cargo looks
# upward for the workspace a package belongs to. In a checkout nested in
# another checkout of this repository (a worktree in the project's
# `.agentdocker/worktrees/`), it would pass the nested root, which
# excludes this package, and reach the outer checkout's, which does not
# know it: "current package believes it's in a workspace when it's not".
[workspace]
