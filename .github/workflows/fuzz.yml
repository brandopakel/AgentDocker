name: Scheduled fuzzing
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Four campaigns of FUZZ_SECONDS each, after two release builds. On a
    # runner that restores no cache the builds take about thirteen
    # minutes and the whole job about twenty-two; the limit leaves that
    # room twice over, and each campaign is bounded by its own time.
    timeout-minutes: 45
    env:
      # The checkout's rust-toolchain.toml names the stable every other job
      # builds with. This job builds with nightly throughout, its plain
      # `cargo` calls included, as it did before that file existed.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: bash scripts/verify.sh fuzz
        env:
          FUZZ_SECONDS: '120'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-inputs
          path: |
            fuzz/artifacts/
            fuzz/corpus/
            artifacts/fuzz-manifest*.json
            artifacts/fuzz-*.log
  # A failed scheduled run is otherwise seen only by asking for it by name:
  # this keeps one issue open while the schedule fails and closes it on the
  # next pass. Its own failure never decides the fuzz result.
  report:
    needs: fuzz
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: scheduled-incident-fuzz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/scheduled_report.py --workflow fuzz.yml --result "$FUZZ_RESULT"
        env:
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          GH_TOKEN: ${{ github.token }}
