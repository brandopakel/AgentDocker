name: Native desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: package and graphical acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Linux graphics and launcher validation
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers fonts-noto-cjk dbus-x11 libxkbcommon-x11-0 libxkbcommon-x11-dev lsof desktop-file-utils
      - name: Build native executables and record their actual directory
        shell: bash
        run: |
          mkdir -p artifacts
          python3 scripts/build_native.py --target "$NATIVE_TARGET" > artifacts/native-build.json
      - name: Package exact source build
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          native_binary_dir=$(python3 -c 'import json; print(json.load(open("artifacts/native-build.json"))["binary_directory"])')
          package_args=(--binary-dir "$native_binary_dir" --output artifacts/desktop --version "$version" --source "$(git rev-parse HEAD)" --target "$NATIVE_TARGET")
          if [[ "$NATIVE_TARGET" == *-apple-darwin ]]; then
            package_args+=(--dmg)
          fi
          python3 packaging/desktop/package.py "${package_args[@]}"
          python3 packaging/desktop/feed.py artifacts/desktop/manifest.json --preview --output "artifacts/desktop/updates-preview-${NATIVE_TARGET}.json"
      - name: Linux native window and fixture discovery
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate artifacts/desktop/agentdocker-desktop/share/applications/agentdocker.desktop
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/desktop_smoke.py --binary-dir artifacts/desktop/agentdocker-desktop/bin --output artifacts/desktop-smoke
      - name: Mac native window and fixture discovery
        if: runner.os == 'macOS'
        run: python3 scripts/desktop_smoke.py --binary-dir artifacts/desktop/AgentDocker.app/Contents/MacOS --output artifacts/desktop-smoke
      - name: Linux Iced actions, terminal rendering and project restoration
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/iced_workflow_smoke.py --binary-dir artifacts/desktop/agentdocker-desktop/bin --output artifacts/iced-workflows
      - name: Mac Iced actions, native accessibility and project restoration
        if: runner.os == 'macOS'
        run: python3 scripts/iced_workflow_smoke.py --binary-dir artifacts/desktop/AgentDocker.app/Contents/MacOS --output artifacts/iced-workflows
      - name: Disposable installation, activation and rollback
        run: python3 scripts/desktop_install_smoke.py --source artifacts/desktop --output artifacts/desktop-install-smoke
      - name: Verified update feed, rejection paths and installation
        run: python3 scripts/desktop_update_smoke.py --source artifacts/desktop --output artifacts/desktop-update-smoke
      - name: Real terminal input, resize, detach, replay and natural exit
        shell: bash
        run: |
          if [[ "$NATIVE_TARGET" == *-apple-darwin ]]; then
            terminal_binary_dir=artifacts/desktop/AgentDocker.app/Contents/MacOS
          else
            terminal_binary_dir=artifacts/desktop/agentdocker-desktop/bin
          fi
          python3 scripts/terminal_smoke.py --binary-dir "$terminal_binary_dir" --output artifacts/terminal-smoke --source "$(git rev-parse HEAD)"
      - name: Packaged hooks and MCP identity lifecycle
        shell: bash
        run: |
          if [[ "$NATIVE_TARGET" == *-apple-darwin ]]; then
            identity_binary_dir=artifacts/desktop/AgentDocker.app/Contents/MacOS
          else
            identity_binary_dir=artifacts/desktop/agentdocker-desktop/bin
          fi
          python3 scripts/identity_smoke.py --binary-dir "$identity_binary_dir" --manifest artifacts/desktop/manifest.json --output artifacts/identity-smoke
          python3 scripts/hook_input_smoke.py --binary "$identity_binary_dir/agentdocker" --manifest artifacts/desktop/manifest.json --output artifacts/hook-input-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            artifacts/desktop/*.zip
            artifacts/desktop/*.dmg
            artifacts/desktop/*.tar.gz
            artifacts/desktop/*.sha256
            artifacts/desktop/manifest.json
            artifacts/desktop/updates-preview-*.json
            artifacts/desktop-smoke
            artifacts/iced-workflows
            artifacts/desktop-install-smoke
            artifacts/desktop-update-smoke
            artifacts/terminal-smoke
            artifacts/identity-smoke
            artifacts/hook-input-smoke
          if-no-files-found: warn
