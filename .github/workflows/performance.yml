name: Performance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: benchmarks
      - run: bash scripts/verify.sh bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmarks
          path: |
            artifacts/
            target/criterion/

  report:
    needs: benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BENCHER_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmarks
          path: results
      - uses: bencherdev/bencher@33cfa4adbcee218fc0b4eb19fb3cb1f1b376401c
      - name: Report existing results
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -n "$BENCHER_API_KEY"
          bencher run --branch main --hash "$SOURCE_SHA" --testbed github-ubuntu --adapter rust_criterion --file results/artifacts/criterion-leases.txt --file results/artifacts/criterion-fingerprint.txt
          bencher run --branch main --hash "$SOURCE_SHA" --testbed github-ubuntu --adapter json --file results/artifacts/socket-1.json --file results/artifacts/socket-10.json --file results/artifacts/socket-100.json
