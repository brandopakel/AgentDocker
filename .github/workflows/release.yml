name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    if: github.ref_protected
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, ui: true }
          - { os: macos-latest, target: x86_64-apple-darwin, ui: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        if: runner.os == 'Linux'
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build and archive
        env:
          BUILD_TARGET: ${{ matrix.target }}
          WITH_UI: ${{ matrix.ui }}
        run: |
          cargo build --locked --release --target "$BUILD_TARGET" -p agentdocker --bins
          binaries="agentdocker agentd"
          if [ "$WITH_UI" = "true" ]; then
            cargo build --locked --release --target "$BUILD_TARGET" -p agentdocker-ui
            binaries="$binaries agentdocker-ui"
            # The same program again, wrapped so macOS calls it
            # AgentDocker and draws its icon rather than naming it after
            # the file. The bare binary stays for `agentdocker ui` on a
            # machine that installs neither into Applications.
            sh scripts/bundle-macos.sh \
              "target/${BUILD_TARGET}/release/agentdocker-ui" \
              "target/${BUILD_TARGET}/release" \
              "${GITHUB_REF_NAME#v}"
            binaries="$binaries AgentDocker.app"
          fi
          mkdir dist
          # shellcheck disable=SC2086  # the binary list is deliberately split
          tar -czf "dist/agentdocker-${BUILD_TARGET}.tar.gz" -C "target/${BUILD_TARGET}/release" $binaries
          cd dist
          shasum -a 256 "agentdocker-${BUILD_TARGET}.tar.gz" > "agentdocker-${BUILD_TARGET}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  formula:
    name: Generate verified Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: checksums
      - name: Generate formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/homebrew/generate.py "$RELEASE_TAG" checksums \
            agentdocker.rb --cask agentdocker-app.rb
      - name: Validate formula and cask
        run: |
          ruby -c agentdocker.rb
          # The cask is only produced when the desktop archives are in
          # the checksums, so its absence is not a failure.
          if [ -f agentdocker-app.rb ]; then ruby -c agentdocker-app.rb; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formula
          path: |
            agentdocker.rb
            agentdocker-app.rb
          if-no-files-found: error
      # A formula nobody can reach installs nothing. This pushes it to
      # the tap when one exists and a token for it is configured, and
      # says so plainly when they are not, rather than failing a release
      # over a distribution channel that has not been set up yet.
      - name: Publish to the tap
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          # Fail rather than ask. A bad token with a prompt available is
          # a job that waits for a username nobody will type.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ -z "${TAP_REPOSITORY:-}" ] || [ -z "${TAP_TOKEN:-}" ]; then
            echo "No tap configured. Set the HOMEBREW_TAP_REPOSITORY variable"
            echo "(owner/homebrew-tap) and the HOMEBREW_TAP_TOKEN secret to"
            echo "publish; the formula is attached to this run either way."
            exit 0
          fi
          # A tap that will not take the formula is a distribution
          # channel that is down, not a release that failed — and an
          # empty token was the only way that was allowed to be true. A
          # revoked one made `git` exit non-zero, failed this job, and
          # took `publish` with it, so a stale secret stopped the release
          # assets from being uploaded at all. The formula and the cask
          # are attached to this run either way.
          if ! git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap; then
            echo "::warning::cannot read ${TAP_REPOSITORY}; is HOMEBREW_TAP_TOKEN still valid?"
            echo "The formula and cask are attached to this run; copy them across by hand."
            exit 0
          fi
          mkdir -p tap/Formula tap/Casks
          cp agentdocker.rb tap/Formula/agentdocker.rb
          [ -f agentdocker-app.rb ] && cp agentdocker-app.rb tap/Casks/agentdocker-app.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git diff --cached --quiet && { echo "tap already current"; exit 0; }
          git commit -m "agentdocker ${RELEASE_TAG}"
          if ! git push; then
            echo "::warning::cannot write to ${TAP_REPOSITORY}; does HOMEBREW_TAP_TOKEN still"
            echo "have Contents: read and write? The formula and cask are attached to this run."
            exit 0
          fi
  publish:
    needs: [build, formula]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
