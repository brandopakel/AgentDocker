[profile.default]
retries = 0
flaky-result = "fail"
# A leaked process holds the test's output pipe for ever, so any
# timeout catches one. 500ms did not distinguish that from a process
# that merely took a moment to tear down: with one test per core, a
# tokio runtime and a SQLite handle closing under full load crossed it
# often enough to fail roughly one run in five, always on a different
# test. Two seconds still fails a real leak on the first run and does
# not fail an honest one.
leak-timeout = { period = "2s", result = "fail" }
slow-timeout = { period = "30s", terminate-after = 3 }

# Stock nextest on Darwin can inherit a sibling test's output pipe during
# concurrent process creation. Keep leak detection strict and serialize test
# processes until upstream spawn serialization is available. Concurrency inside
# each test is unchanged. See docs/TEST-RUNNER-MACOS.md for captured evidence.
[[profile.default.overrides]]
platform = { host = 'cfg(target_os = "macos")' }
filter = 'all()'
test-group = 'macos-test-process'

[test-groups.macos-test-process]
max-threads = 1

[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
